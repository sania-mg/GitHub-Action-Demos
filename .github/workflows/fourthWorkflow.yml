
name: Fourth Workflow - Cache and Artifact Demo


on:
  workflow_dispatch:

jobs:

  # ==========================================================
  # BUILD JOB
  # ==========================================================
  build:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"


      # --------------------------------------------------------
      # 3. CACHE
      #
      # Cache stores npm's downloaded packages so that
      # subsequent workflow runs can reuse them.
      # --------------------------------------------------------
      - name: Cache npm packages
        uses: actions/cache@v4
        with:

          # Location being cached
          path: ~/.npm

          # Unique cache key
          #
          # The key changes when:
          # - OS changes
          # - Node version changes
          # - package-lock.json changes
          key: ${{ runner.os }}-node-22-npm-${{ hashFiles('package-lock.json') }}

          # If exact key doesn't exist, GitHub can look
          # for an older cache with this prefix.
          restore-keys: |
            ${{ runner.os }}-node-22-npm-


      # --------------------------------------------------------
      # 4. Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: npm ci


      # --------------------------------------------------------
      # 5. Test application
      # --------------------------------------------------------
      - name: Run tests
        run: npm test


      # --------------------------------------------------------
      # 6. CREATE DEPLOYMENT PACKAGE
      #
      # This is the data that we want to pass to another job.
      # --------------------------------------------------------
      - name: Prepare application package
        run: |
          mkdir deployment

          cp package.json deployment/
          cp package-lock.json deployment/

          mkdir deployment/src
          cp src/server.js deployment/src/


      # --------------------------------------------------------
      # 7. UPLOAD ARTIFACT
      #
      # Artifact persists beyond the current runner/job.
      # Another job can download this exact output.
      # --------------------------------------------------------
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-webapp
          path: deployment/


  # ==========================================================
  # VERIFY JOB
  # ==========================================================
  verify:

    # This creates the dependency:
    #
    # build
    #   ↓
    # verify
    #
    # verify starts only after build succeeds.
    needs: build

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 8. DOWNLOAD ARTIFACT
      #
      # The runner for this job is a NEW runner.
      # It doesn't have the files created in the build job.
      #
      # The artifact is how we transfer the build output.
      # --------------------------------------------------------
      - name: Download application artifact
        uses: actions/download-artifact@v5
        with:
          name: node-webapp
          path: downloaded/


      # --------------------------------------------------------
      # 9. VERIFY ARTIFACT
      # --------------------------------------------------------
      - name: Display downloaded files
        run: |
          echo "Downloaded application:"
          find downloaded -type f

          echo ""
          echo "package.json:"
          cat downloaded/package.json