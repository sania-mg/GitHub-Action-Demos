name: Fourth Flow Artifact and Cache Demo

on:
  workflow_dispatch:

jobs:

  # ==========================================================
  # BUILD JOB
  # ==========================================================
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:

    # --------------------------------------------------------
    # 1. CHECKOUT
    # --------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # --------------------------------------------------------
    # 2. SETUP NODE
    # --------------------------------------------------------
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    # --------------------------------------------------------
    # 3. CACHE NPM
    # --------------------------------------------------------
    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:

        # Location of npm's downloaded package cache
        path: ~/.npm

        # Create a unique cache key based on:
        #   Operating System
        #   Node.js version
        #   package-lock.json contents
        #
        # If package-lock.json changes, the hash changes,
        # resulting in a new cache.
        key: ${{ runner.os }}-node-${{ matrix.node-version }}-npm-${{ hashFiles('package-lock.json') }}

        # If an exact cache key is unavailable,
        # GitHub can restore a cache beginning with
        # this prefix.
        restore-keys: |
          ${{ runner.os }}-node-${{ matrix.node-version }}-npm-

    # --------------------------------------------------------
    # 4. INSTALL DEPENDENCIES
    # --------------------------------------------------------
    - name: Install dependencies
      run: npm ci

    # --------------------------------------------------------
    # 5. BUILD
    # --------------------------------------------------------
    - name: Build application
      run: npm run build

    # --------------------------------------------------------
    # 6. UPLOAD ARTIFACT
    # --------------------------------------------------------
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:

        # Each matrix execution gets its own artifact.
        name: build-${{ matrix.node-version }}

        # Upload everything generated inside dist/
        path: dist/


  # ==========================================================
  # VERIFY JOB
  # ==========================================================
  verify:

    # This creates a dependency between jobs.
    #
    # The verify job will start only after ALL matrix
    # executions of the build job have completed.
    needs: build

    runs-on: ubuntu-latest

    steps:

    # --------------------------------------------------------
    # 7. DOWNLOAD ARTIFACT
    # --------------------------------------------------------
    - name: Download Node 20 artifact
      uses: actions/download-artifact@v5
      with:
        name: build-20.x
        path: downloaded/node-20

    - name: Download Node 22 artifact
      uses: actions/download-artifact@v5
      with:
        name: build-22.x
        path: downloaded/node-22

    # --------------------------------------------------------
    # 8. VERIFY ARTIFACT CONTENT
    # --------------------------------------------------------
    - name: Display downloaded files
      run: |
        echo "Downloaded artifacts:"
        find downloaded -type f

        echo ""
        echo "Node 20 build:"
        cat downloaded/node-20/build-info.txt

        echo ""
        echo "Node 22 build:"
        cat downloaded/node-22/build-info.txt
