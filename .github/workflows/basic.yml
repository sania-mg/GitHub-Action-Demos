name : Basic Workflow
on: 
  push: # on pushing the code on the main branch 
  workflow_dispatch: # manually
  
    
jobs:
  Hello-Job:
    runs-on: ubuntu-latest
    steps: 
      - name: Hello World
        run : echo "Hello World"
      - name: Multi-line bash
        run : |
            echo "I am"
            echo "a multi-line"
            echo "script"
  echo-goodbye:
      needs: Hello-Job 
      runs-on: ubuntu-slim
      steps:
        - name: Say GoodBye
          run: echo "GoodBye!..."
        - uses: actions/checkout@v7
      
      
  
  
   
